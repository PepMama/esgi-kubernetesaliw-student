resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Reverse proxy compose-only — en K8s, l'Ingress prend le relais.
  location ~ ^/api/auth(/.*)?$ {
    set $upstream auth-service:3001;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location ~ ^/api/sites(/.*)?$ {
    set $upstream sites-service:3002;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location ~ ^/api/rooms(/.*)?$ {
    set $upstream rooms-service:3003;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location ~ ^/api/bookings(/.*)?$ {
    set $upstream bookings-service:3004;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
