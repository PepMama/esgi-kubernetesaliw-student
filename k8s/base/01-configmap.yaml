# =============================================================================
# ConfigMap `app-config` — valeurs NON sensibles partagées par tous les services
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # --- URLs internes des services (DNS K8s) -----------------------------------
  # Format attendu : http(s)://<service>.<namespace>.svc.cluster.local:<port>
  # mTLS ne sont pas encore utilisés, les URLs restent HTTP.
  AUTH_SERVICE_URL: "http://auth-service.salleenfrance.svc.cluster.local:3001"
  SITES_SERVICE_URL: "http://sites-service.salleenfrance.svc.cluster.local:3002"
  ROOMS_SERVICE_URL: "http://rooms-service.salleenfrance.svc.cluster.local:3003"
  BOOKINGS_SERVICE_URL: "http://bookings-service.salleenfrance.svc.cluster.local:3004"

  # --- Chemins des certificats injectés dans les pods (étape 11) --------------
  # Convention proposée : /tls/tls.crt, /tls/tls.key, /tls/ca.crt
  TLS_CERT_PATH: "/tls/tls.crt"
  TLS_KEY_PATH:  "/tls/tls.key"
  TLS_CA_PATH:   "/tls/ca.crt"
