# =============================================================================
# Redis — Deployment + Service ClusterIP + ConfigMap pour redis.conf
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
data:
  redis.conf: |
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    appendonly no
    save ""
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: salleenfrance
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: conf
              mountPath: /usr/local/etc/redis
          readinessProbe:
            exec:
              command: ["redis-cli", "PING"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "PING"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: conf
          configMap:
            name: redis-config
