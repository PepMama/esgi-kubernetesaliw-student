# =============================================================================
# Redis — Deployment + Service ClusterIP + ConfigMap pour redis.conf
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: salleenfrance
data:
  redis.conf: |
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    # TODO : ajustez ou ajoutez les directives que vous jugez nécessaires
    # (appendonly ? save ? requirepass ?)
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: salleenfrance
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: salleenfrance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: salleenfrance
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: conf
              mountPath: /usr/local/etc/redis
          # TODO : probes (readiness + liveness) — `redis-cli PING`.
          readinessProbe: {}
          livenessProbe:  {}
          # TODO : resources.requests / limits.
          resources: {}
      volumes:
        - name: conf
          configMap:
            name: redis-config
