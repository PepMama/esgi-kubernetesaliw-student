# =============================================================================
# PostgreSQL — StatefulSet + PVC + Service headless
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: salleenfrance
data:
  init.sql: |
    -- TODO : à remplacer par le contenu de seed/init.sql
    -- (vous pouvez aussi monter un ConfigMap généré à partir du fichier réel
    --  via `kubectl create configmap postgres-init --from-file=seed/init.sql`)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: salleenfrance
spec:
  clusterIP: None        # headless — requis par le StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: salleenfrance
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: salleenfrance
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          # TODO : déclarer une readinessProbe ET une livenessProbe
          # Indices : commande `pg_isready -U $POSTGRES_USER`,
          # `initialDelaySeconds` adapté au temps d'init du seed.
          readinessProbe: {}  # TODO
          livenessProbe:  {}  # TODO

          # TODO : déclarer resources.requests et resources.limits (CPU/RAM).
          # Justifiez les valeurs choisies dans le rapport.
          resources: {}       # TODO
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # TODO : choisir une storageClassName et une taille adaptées
        # storageClassName: standard
        resources:
          requests:
            storage: 0Gi   # TODO
