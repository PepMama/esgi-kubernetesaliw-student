# =============================================================================
# PostgreSQL — StatefulSet + PVC + Service headless
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
data:
  init.sql: |
    -- =============================================================================
    -- Schéma SalleEnFrance — initialisation
    -- =============================================================================

    CREATE TABLE IF NOT EXISTS users (
      id          SERIAL PRIMARY KEY,
      email       TEXT UNIQUE NOT NULL,
      password    TEXT NOT NULL,
      created_at  TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS sites (
      id     SERIAL PRIMARY KEY,
      name   TEXT NOT NULL,
      city   TEXT NOT NULL,
      region TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS rooms (
      id        SERIAL PRIMARY KEY,
      site_id   INT REFERENCES sites(id) ON DELETE CASCADE,
      name      TEXT NOT NULL,
      capacity  INT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS bookings (
      id         SERIAL PRIMARY KEY,
      room_id    INT REFERENCES rooms(id) ON DELETE CASCADE,
      user_id    INT REFERENCES users(id) ON DELETE CASCADE,
      starts_at  TIMESTAMPTZ NOT NULL,
      ends_at    TIMESTAMPTZ NOT NULL,
      CHECK (ends_at > starts_at)
    );

    INSERT INTO users (email, password) VALUES
      ('demo@salleenfrance.fr', 'changeme'),
      ('admin@salleenfrance.fr', 'changeme')
    ON CONFLICT DO NOTHING;

    INSERT INTO sites (name, city, region) VALUES
      ('SalleEnFrance Paris République',  'Paris',     'Île-de-France'),
      ('SalleEnFrance Lyon Part-Dieu',    'Lyon',      'Auvergne-Rhône-Alpes'),
      ('SalleEnFrance Marseille Vieux-Port', 'Marseille', 'Provence-Alpes-Côte-d''Azur'),
      ('SalleEnFrance Bordeaux Chartrons','Bordeaux',  'Nouvelle-Aquitaine'),
      ('SalleEnFrance Lille Euralille',   'Lille',     'Hauts-de-France')
    ON CONFLICT DO NOTHING;

    INSERT INTO rooms (site_id, name, capacity) VALUES
      (1, 'Versailles',  12),
      (1, 'Concorde',    8),
      (2, 'Fourvière',   10),
      (2, 'Croix-Rousse', 6),
      (3, 'Calanques',   14),
      (4, 'Garonne',     8),
      (5, 'Beffroi',     12)
    ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None        # headless — requis par le StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: salleenfrance
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: salleenfrance
          app.kubernetes.io/managed-by: kustomize
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
