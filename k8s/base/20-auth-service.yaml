# =============================================================================
# auth-service — Deployment + Service + PDB
#
# Patron à RÉPLIQUER pour sites-service / rooms-service / bookings-service.
# Adaptez : nom, port, image, variables d'env spécifiques.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    # Port applicatif (mTLS à partir de l'étape 11)
    - name: https
      port: 3001
      targetPort: 3001
    # Port "health" en HTTP simple, accessible aux probes K8s sans cert client
    - name: health
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  namespace: salleenfrance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: salleenfrance
spec:
  # TODO : nombre de répliques (cf. cahier des charges étape 9).
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: salleenfrance
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          # TODO : référencer l'image que vous avez buildée et chargée dans kind
          # Format attendu : salleenfrance/auth-service:<sha>
          image: ""
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 3001
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "3001"
            # TODO : ajouter DATABASE_URL en composant à partir des champs du Secret
            # (utilisez `valueFrom.secretKeyRef` ou une env construite côté code).
          # TODO : volumes pour le certificat mTLS (étape 11)
          # volumeMounts:
          #   - name: tls
          #     mountPath: /tls
          #     readOnly: true

          # TODO : probes — pointez sur le port `health` (8080) en HTTP simple.
          readinessProbe: {}
          livenessProbe:  {}

          # TODO : resources.requests / limits — argumentez votre choix.
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # TODO (étape 11) : volume monté depuis le secret généré par cert-manager
      # volumes:
      #   - name: tls
      #     secret:
      #       secretName: auth-service-tls
