# =============================================================================
# Secret `app-secrets` — valeurs sensibles
#
# ATTENTION : NE JAMAIS commiter ce fichier rempli. Pour le TP, vous le
# générerez dynamiquement avant `kubectl apply` :
#
#   kubectl -n salleenfrance create secret generic app-secrets \
#     --from-literal=POSTGRES_USER=salleenfrance \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# OU vous mettez en place SealedSecrets (bonus).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: salleenfrance
  labels:
    app.kubernetes.io/part-of: salleenfrance
type: Opaque
stringData:
  # TODO : à remplacer par votre stratégie de gestion des secrets.
  # Le YAML ci-dessous n'est PAS celui que vous appliquerez en prod.
  POSTGRES_USER: "A_REMPLACER"
  POSTGRES_PASSWORD: "A_REMPLACER"
  POSTGRES_DB: "salleenfrance"
  JWT_SECRET: "A_REMPLACER"
