# =============================================================================
# Secret `app-secrets` — valeurs sensibles
#
# ATTENTION : NE JAMAIS commiter ce fichier rempli. Pour le TP, vous le
# générerez dynamiquement avant `kubectl apply` :
#
#   kubectl -n salleenfrance create secret generic app-secrets \
#     --from-literal=POSTGRES_USER=salleenfrance \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# OU vous mettez en place SealedSecrets (bonus).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: salleenfrance
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/part-of: salleenfrance
    app.kubernetes.io/managed-by: kustomize
  annotations:
    salleenfrance.dev/secret-strategy: "generated-outside-git"
type: Opaque
stringData:
  # Valeurs volontairement non secrètes: ce fichier sert de gabarit.
  # En déploiement reel, app-secrets doit être regénéré hors Git avec kubectl,
  # la CI/CD ou une solution dédiée comme SealedSecrets.
  POSTGRES_USER: "salleenfrance"
  POSTGRES_PASSWORD: "CHANGE_ME_GENERATE_OUTSIDE_GIT"
  POSTGRES_DB: "salleenfrance"
  JWT_SECRET: "CHANGE_ME_GENERATE_OUTSIDE_GIT"
